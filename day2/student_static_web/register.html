<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="styles.css">
<body>
      <div id="navigation">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </div>
    <br>
    <h1>Register Page</h1>
    <div id="form">
    <form >
        <label for="username">Username:</label>
        <input type="text" id="usernamebox" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="passwordbox" name="password" required>
        <br>
        <button type="submit" onclick="function register(){
            if(length(document.getElementById('usernamebox').value) == 0 && length(document.getElementById('passwordbox').value) == 0){
                alert('Please enter username and password');
                return;
            }
            window.location.href = 'login.html';
        }
        register()">Register</button>
    </form>
    </div>
</body>
</html>
