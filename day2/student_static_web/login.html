<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <div id="navigation">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </div>
    <br>
    <h1>Login Page</h1>
    <form action="dashboard.html" method="post">
       <label for="username">Username:</label>
       <input type="text" id="usernamebox" name="username" required>
       <br>
       <label for="password">Password:</label>
       
       <input type="password" id="passwordbox" name="password" required>
       <br>
      

       <button type="submit" onclick="function login(){
        if(length(document.getElementById('usernamebox').value) == 0 && length(document.getElementById('passwordbox').value) == 0){
            alert('Please enter username and password');
            return;
        }
        window.location.href = 'dashboard.html';
       }
       login()">Login</button>
    </form>
</body>
</html>
