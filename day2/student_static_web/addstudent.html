<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <div id="navigation">
        <a href="addstudent.html">Home</a>
        <a href="viewstudents.html">Login</a>
        <a href="dashboard.html">Register</a>
        <a href="index.html">Logout</a>
    </div>
    <br>
    <h1>Add Student Page</h1>
    <form >
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
        <br>
        <button type="button" onclick="addstudent()">Add Student</button>
        
    <script>
        function addstudent(){
            if(document.getElementById('name').value.length == 0 || document.getElementById('email').value.length == 0 || document.getElementById('age').value.length == 0){
                alert('Please enter all the details');
                return;
            }
          
            window.location.href = 'viewstudent.html';
        }   
    </script>
</body>


</html>
