<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Student Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-item nav-link" href="index.html">Home</a>
                <a class="nav-item nav-link" href="dashboard.html">Manage Students</a>
                <a class="nav-item nav-link active" href="login.html">Login</a>
                <a class="nav-item nav-link" href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4">Login</h3>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Log In</button>
                    </form>
                    
                    <p class="text-center mt-3 small">New user? <a href="register.html">Register here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
      
        if (!localStorage.getItem('users')) {
            const defaultUser = [{ name: "Student Admin", email: "admin@test.com", password: "password123" }];
            localStorage.setItem('users', JSON.stringify(defaultUser));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const foundUser = users.find(u => u.email === email && u.password === password);

            if (foundUser) {
                
                const header = btoa(JSON.stringify({ alg: "HS256", typ: "JWT" }));
                const payload = btoa(JSON.stringify({ sub: email, exp: Date.now() + 3600000 }));
                const signature = btoa("mock-secret");
                const fakeJWTToken = `${header}.${payload}.${signature}`;

            
                localStorage.setItem('token', fakeJWTToken);

                alert("Login Successful!");
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid Email or Password combinations!");
            }
        });
    </script>
</body>
</html>
